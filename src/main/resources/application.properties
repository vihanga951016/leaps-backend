spring.application.name=leaps-backend

# Database (MySQL). Password is never committed: set LEAPS_DB_PASSWORD in the environment.
spring.datasource.url=${LEAPS_DB_URL:jdbc:mysql://localhost:3306/leaps?serverTimezone=UTC}
spring.datasource.username=${LEAPS_DB_USER:leaps}
spring.datasource.password=${LEAPS_DB_PASSWORD}

# Schema is managed by Flyway from Stage 1; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
